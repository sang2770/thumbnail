name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          # Cai DirectML cho GPU Windows (tuong thich 100% RTX 50x / 40x / 30x / AMD / Intel)
          pip install onnxruntime-directml pyinstaller

      - name: Setup FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy FFmpeg binaries into project root
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobePath = (Get-Command ffprobe).Source
          Copy-Item $ffmpegPath -Destination .\ffmpeg.exe
          Copy-Item $ffprobePath -Destination .\ffprobe.exe
          Write-Host "Da copy ffmpeg.exe va ffprobe.exe vao project root."

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller ThumbnailPipeline.spec

      - name: Package Distributable Folder
        shell: pwsh
        run: |
          # Tao thu muc input, output, net san cho nguoi dung cuoi
          New-Item -ItemType Directory -Force -Path dist\ThumbnailPipeline\input
          New-Item -ItemType Directory -Force -Path dist\ThumbnailPipeline\output
          New-Item -ItemType Directory -Force -Path dist\ThumbnailPipeline\net
          Compress-Archive -Path dist\ThumbnailPipeline\* -DestinationPath dist\ThumbnailPipeline-Windows.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThumbnailPipeline-Windows
          path: dist/ThumbnailPipeline-Windows.zip
          retention-days: 14
